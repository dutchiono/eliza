name: Build & Release (Home Electrobun)

on:
  push:
    tags:
      - "eliza-home-v*"
      - "eliza-home-canary"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (defaults to eliza-home-canary)"
        required: false
        type: string
      source_sha:
        description: "Commit SHA to build (optional)"
        required: false
        type: string
      draft:
        description: "Create as draft release"
        required: false
        type: boolean
        default: true

concurrency:
  group: release-home-electrobun-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CI: "true"
  BUN_VERSION: "1.3.9"
  RELEASE_REF: ${{ inputs.source_sha || github.sha }}

jobs:
  prepare:
    name: Prepare Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      env: ${{ steps.version.outputs.env }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Determine version + env
        id: version
        shell: bash
        run: |
          DEFAULT_VERSION="$(node -p "require('./packages/home/package.json').version")"
          if [[ -n "${{ inputs.tag }}" ]]; then
            TAG="${{ inputs.tag }}"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="eliza-home-canary"
          fi

          if [[ "$TAG" =~ ^eliza-home-v(.+)$ ]]; then
            VERSION="${BASH_REMATCH[1]}"
          elif [[ "$TAG" =~ ^v(.+)$ ]]; then
            VERSION="${BASH_REMATCH[1]}"
          else
            VERSION="$DEFAULT_VERSION"
          fi

          if [[ "$TAG" == *"canary"* ]] || echo "$VERSION" | grep -qE '(alpha|beta|rc|nightly)'; then
            BUILD_ENV="canary"
          else
            BUILD_ENV="stable"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "env=$BUILD_ENV" >> "$GITHUB_OUTPUT"
          echo "Release: $VERSION (tag: $TAG, env: $BUILD_ENV)"

  validate-release:
    name: Validate Release Inputs
    needs: prepare
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -euo pipefail {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-home-electrobun-validate-${{ hashFiles('bun.lock') }}
          restore-keys: bun-home-electrobun-validate-

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Generate shared proto types
        run: bun run generate:types

      - name: Align version with release tag
        run: node scripts/align-home-electrobun-version.mjs
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}

      - name: Release readiness checks
        run: bun run release:check:home-electrobun

  build:
    name: Build ${{ matrix.platform.name }}
    needs: [prepare, validate-release]
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 150
    defaults:
      run:
        shell: bash -euo pipefail {0}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: macOS (Apple Silicon)
            os: macos
            runner: macos-14
            artifact-name: macos-arm64
          - name: macOS (Intel)
            os: macos
            runner: macos-15-intel
            artifact-name: macos-x64
          - name: Windows
            os: windows
            runner: windows-latest
            artifact-name: windows-x64
          - name: Linux
            os: linux
            runner: ubuntu-latest
            artifact-name: linux-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-home-electrobun-${{ matrix.platform.artifact-name }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-home-electrobun-${{ matrix.platform.artifact-name }}-

      - name: Install root dependencies
        run: |
          if [ "${{ matrix.platform.os }}" = "macos" ] && [ "${{ matrix.platform.artifact-name }}" = "macos-x64" ]; then
            arch -x86_64 bun install --frozen-lockfile
          else
            bun install --frozen-lockfile
          fi

      - name: Generate shared proto types
        run: bun run generate:types

      - name: Cache Whisper models and binaries
        if: matrix.platform.os == 'macos' || matrix.platform.os == 'linux'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/milady/whisper
            node_modules/whisper-node/lib/whisper.cpp/main
            node_modules/whisper-node/lib/whisper.cpp/build
          key: whisper-home-electrobun-${{ matrix.platform.artifact-name }}-${{ hashFiles('packages/home/electrobun/scripts/build-whisper.sh', 'packages/home/electrobun/scripts/build-whisper-universal.sh') }}
          restore-keys: whisper-home-electrobun-${{ matrix.platform.artifact-name }}-

      - name: Align version with release tag
        run: node scripts/align-home-electrobun-version.mjs
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}

      - name: Stage desktop bundle inputs
        run: |
          if [ "${{ matrix.platform.os }}" = "macos" ] && [ "${{ matrix.platform.artifact-name }}" = "macos-x64" ]; then
            ELIZA_HOME_SKIP_NATIVE_EFFECTS=1 ELIZA_HOME_DESKTOP_COMMAND_PREFIX="arch -x86_64" node scripts/home-desktop-build.mjs stage --skip-install --skip-generate-types
          elif [ "${{ matrix.platform.os }}" = "macos" ]; then
            ELIZA_HOME_SKIP_NATIVE_EFFECTS=1 node scripts/home-desktop-build.mjs stage --skip-install --skip-generate-types
          else
            node scripts/home-desktop-build.mjs stage --skip-install --skip-generate-types
          fi

      - name: Set up macOS signing keychain
        if: matrix.platform.os == 'macos'
        id: macos-keychain
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          if [ -z "$CSC_LINK" ]; then
            echo "::warning::CSC_LINK not set — building unsigned (no codesign/notarize)"
            echo "skip_codesign=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          KEYCHAIN_PATH="$RUNNER_TEMP/eliza-home-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          CERT_PATH="$RUNNER_TEMP/cert.p12"
          echo "$CSC_LINK" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$CSC_KEY_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          rm -f "$CERT_PATH"

          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep "Developer ID Application" | head -1 | sed 's/.*\"\\(.*\\)\"/\\1/')
          if [ -z "$IDENTITY" ]; then
            echo "::error::No 'Developer ID Application' identity found in certificate"
            exit 1
          fi

          echo "developer_id=$IDENTITY" >> "$GITHUB_OUTPUT"
          echo "skip_codesign=" >> "$GITHUB_OUTPUT"

      - name: Ensure Windows rcedit binary is available for Electrobun
        if: matrix.platform.os == 'windows'
        shell: pwsh
        run: |
          $electrobunDir = Join-Path $PWD "packages/home/electrobun/node_modules/electrobun"
          $resolvedElectrobunDir = node -e @'
            const fs = require("node:fs");
            const packageDir = process.argv[1];
            try {
              process.stdout.write(fs.realpathSync(packageDir));
            } catch (error) {
              process.stdout.write(packageDir);
            }
          '@ $electrobunDir
          if ($null -eq $resolvedElectrobunDir) {
            $resolvedElectrobunDir = $electrobunDir
          } elseif ($resolvedElectrobunDir -is [array]) {
            $resolvedElectrobunDir = ($resolvedElectrobunDir -join "")
          }
          $resolvedElectrobunDir = "$resolvedElectrobunDir".Trim()
          if ([string]::IsNullOrWhiteSpace($resolvedElectrobunDir)) {
            $resolvedElectrobunDir = $electrobunDir
          }

          $globalNodeModules = Join-Path $env:USERPROFILE ".bun\\install\\global\\node_modules"
          $globalRceditDir = Join-Path $globalNodeModules "rcedit"
          $globalRceditExe = Join-Path $globalRceditDir "bin\\rcedit-x64.exe"

          if (-not (Test-Path $globalRceditExe)) {
            bun install -g "rcedit@4.0.1"
          }

          $resolvedRceditPackageJson = node -e @'
            const { createRequire } = require("node:module");
            const path = require("node:path");
            const electrobunDir = process.argv[1];
            try {
              const req = createRequire(path.join(electrobunDir, "package.json"));
              process.stdout.write(req.resolve("rcedit/package.json"));
            } catch (error) {
              process.stdout.write("");
            }
          '@ $electrobunDir

          if ($null -eq $resolvedRceditPackageJson) {
            $resolvedRceditPackageJson = ""
          } elseif ($resolvedRceditPackageJson -is [array]) {
            $resolvedRceditPackageJson = ($resolvedRceditPackageJson -join "")
          }

          $resolvedRceditPackageJson = "$resolvedRceditPackageJson".Trim()
          if ([string]::IsNullOrWhiteSpace($resolvedRceditPackageJson)) {
            $resolvedRceditDir = Join-Path $resolvedElectrobunDir "node_modules\\rcedit"
          } else {
            $resolvedRceditDir = Split-Path -Parent $resolvedRceditPackageJson
          }
          $resolvedRceditExe = Join-Path $resolvedRceditDir "bin\\rcedit-x64.exe"

          if (-not (Test-Path $resolvedRceditExe)) {
            $resolvedNodeModulesDir = Split-Path -Parent $resolvedRceditDir
            New-Item -ItemType Directory -Force -Path $resolvedNodeModulesDir | Out-Null
            if (Test-Path $resolvedRceditDir) {
              Remove-Item -Recurse -Force $resolvedRceditDir
            }
            Copy-Item -Recurse -Force $globalRceditDir $resolvedNodeModulesDir
          }

          if (-not (Test-Path $resolvedRceditExe)) {
            Write-Error "rcedit-x64.exe is still missing at $resolvedRceditExe"
            exit 1
          }

      - name: Pre-extract electrobun native CLI on Windows
        if: matrix.platform.os == 'windows'
        shell: pwsh
        run: |
          $electrobunDir = Join-Path $PWD "packages/home/electrobun/node_modules/electrobun"
          $resolvedElectrobunDir = node -e @'
            const fs = require("node:fs");
            const packageDir = process.argv[1];
            try {
              process.stdout.write(fs.realpathSync(packageDir));
            } catch (error) {
              process.stdout.write(packageDir);
            }
          '@ $electrobunDir
          if ($null -eq $resolvedElectrobunDir) {
            $resolvedElectrobunDir = $electrobunDir
          } elseif ($resolvedElectrobunDir -is [array]) {
            $resolvedElectrobunDir = ($resolvedElectrobunDir -join "")
          }
          $resolvedElectrobunDir = "$resolvedElectrobunDir".Trim()
          if ([string]::IsNullOrWhiteSpace($resolvedElectrobunDir)) {
            $resolvedElectrobunDir = $electrobunDir
          }

          $cacheDir = Join-Path $resolvedElectrobunDir ".cache"
          $binDir = Join-Path $resolvedElectrobunDir "bin"
          $cliBinary = Join-Path $cacheDir "electrobun.exe"
          $binBinary = Join-Path $binDir "electrobun.exe"

          if (Test-Path $binBinary) {
            exit 0
          }

          $version = (Get-Content (Join-Path $resolvedElectrobunDir "package.json") | ConvertFrom-Json).version
          $assetName = "electrobun-cli-win-x64.tar.gz"
          $releaseApiUrl = "https://api.github.com/repos/blackboardsh/electrobun/releases/tags/v$version"
          $headers = @{
            Accept = "application/vnd.github+json"
            "User-Agent" = "eliza-home-release-electrobun"
          }
          if ($env:GITHUB_TOKEN) {
            $headers.Authorization = "Bearer $env:GITHUB_TOKEN"
          }

          $release = Invoke-RestMethod -Uri $releaseApiUrl -Headers $headers
          $asset = @($release.assets) | Where-Object { $_.name -eq $assetName } | Select-Object -First 1
          if (-not $asset) {
            Write-Error "Could not find $assetName in electrobun release v$version"
            exit 1
          }
          if (-not $asset.digest -or -not $asset.digest.StartsWith("sha256:")) {
            Write-Error "GitHub release metadata for $assetName is missing a sha256 digest"
            exit 1
          }

          $tarPath = Join-Path $cacheDir "electrobun-win-x64.tar.gz"
          $expectedHash = $asset.digest.Substring(7).ToLowerInvariant()

          New-Item -ItemType Directory -Force -Path $cacheDir | Out-Null
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $tarPath -UseBasicParsing
          $actualHash = (Get-FileHash -Path $tarPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
            Write-Error "electrobun CLI checksum mismatch: expected $expectedHash but got $actualHash"
            exit 1
          }

          & "C:\\Windows\\System32\\tar.exe" -xzf $tarPath -C $cacheDir
          Remove-Item $tarPath -Force

          if (-not (Test-Path $cliBinary)) {
            Write-Error "electrobun.exe not found in $cacheDir after extraction"
            exit 1
          }

          New-Item -ItemType Directory -Force -Path $binDir | Out-Null
          Copy-Item $cliBinary $binBinary
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Inno Setup on Windows
        if: matrix.platform.os == 'windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            Write-Error "ISCC.exe not found after installing Inno Setup"
            exit 1
          }
          "INNO_SETUP_ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build Electrobun app
        run: |
          if [ "${{ matrix.platform.os }}" = "macos" ] && [ "${{ matrix.platform.artifact-name }}" = "macos-x64" ]; then
            ELIZA_HOME_DESKTOP_COMMAND_PREFIX="arch -x86_64" node scripts/home-desktop-build.mjs package --env=${{ needs.prepare.outputs.env }}
          else
            node scripts/home-desktop-build.mjs package --env=${{ needs.prepare.outputs.env }}
          fi
        env:
          ELECTROBUN_DEVELOPER_ID: ${{ steps.macos-keychain.outputs.developer_id }}
          ELECTROBUN_APPLEID: ${{ secrets.APPLE_ID }}
          ELECTROBUN_APPLEIDPASS: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          ELECTROBUN_TEAMID: ${{ secrets.APPLE_TEAM_ID }}
          ELECTROBUN_SKIP_CODESIGN: ${{ steps.macos-keychain.outputs.skip_codesign }}
          ELIZA_HOME_ELECTROBUN_NOTARIZE: 0

      - name: Inject version.json into bundle (Windows)
        if: matrix.platform.os == 'windows'
        shell: pwsh
        run: |
          $version = (Get-Content packages/home/electrobun/package.json | ConvertFrom-Json).version
          $envName = "${{ needs.prepare.outputs.env }}"
          $buildRoot = "packages/home/electrobun/build"

          Get-ChildItem -Path $buildRoot -Recurse -Directory -Filter "Resources" | ForEach-Object {
            $versionJson = @{
              identifier = "ai.eliza.home"
              channel = $envName
              name = "eliza-home"
              version = $version
            } | ConvertTo-Json -Compress
            $dest = Join-Path $_.FullName "version.json"
            Set-Content -Path $dest -Value $versionJson -Encoding utf8
          }

      - name: Build Windows wrapper installer
        if: matrix.platform.os == 'windows'
        shell: pwsh
        run: |
          $version = (Get-Content packages/home/electrobun/package.json | ConvertFrom-Json).version
          pwsh -File packages/home/electrobun/scripts/build-wrapper-installer.ps1 `
            -BuildDir packages/home/electrobun/build `
            -ArtifactsDir packages/home/electrobun/artifacts `
            -BuildEnv "${{ needs.prepare.outputs.env }}" `
            -Version $version

      - name: Inject version.json into bundle (macOS / Linux)
        if: matrix.platform.os != 'windows'
        run: |
          VERSION="$(node -p "require('./packages/home/electrobun/package.json').version")"
          ENV_NAME="${{ needs.prepare.outputs.env }}"
          find packages/home/electrobun/build -type d -name "Resources" | while read -r res_dir; do
            dest="$res_dir/version.json"
            printf '{"identifier":"ai.eliza.home","channel":"%s","name":"eliza-home","version":"%s"}' \
              "$ENV_NAME" "$VERSION" > "$dest"
          done

      - name: List build output
        run: |
          echo "=== Home Electrobun artifacts ==="
          find packages/home/electrobun/artifacts -type f 2>/dev/null | sort || echo "(no artifacts directory)"

      - name: Smoke test packaged Windows app
        if: matrix.platform.os == 'windows'
        shell: pwsh
        env:
          MILADY_DISABLE_LOCAL_EMBEDDINGS: "1"
          MILADY_TEST_WINDOWS_SMOKE_TEMP_ROOT: ${{ runner.temp }}\eh
          MILADY_TEST_WINDOWS_LAUNCHER_DIR: ${{ runner.temp }}\eh\launcher
          MILADY_TEST_WINDOWS_LAUNCHER_PATH_FILE: ${{ runner.temp }}\eh\launcher.txt
          MILADY_TEST_WINDOWS_SMOKE_LOG_FILE: ${{ runner.temp }}\eh\smoke-events.jsonl
        run: |
          Remove-Item $env:MILADY_TEST_WINDOWS_SMOKE_TEMP_ROOT -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $env:MILADY_TEST_WINDOWS_LAUNCHER_DIR -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $env:MILADY_TEST_WINDOWS_LAUNCHER_PATH_FILE -Force -ErrorAction SilentlyContinue
          Remove-Item $env:MILADY_TEST_WINDOWS_SMOKE_LOG_FILE -Force -ErrorAction SilentlyContinue
          pwsh -File packages/home/electrobun/scripts/smoke-test-windows.ps1 `
            -PreferInstaller `
            -InstallTimeoutSeconds 600 `
            -TimeoutSeconds 300 `
            -BuildEnv "${{ needs.prepare.outputs.env }}"

      - name: Smoke test packaged macOS app
        if: matrix.platform.os == 'macos'
        env:
          SMOKE_DIAGNOSTICS_DIR: ${{ runner.temp }}/eliza-home-smoke-diagnostics
        run: |
          STARTUP_TIMEOUT=420 \
          LIVENESS_TIMEOUT=10 \
          SKIP_BUILD=1 \
          SKIP_SIGNATURE_CHECK=1 \
          bash packages/home/electrobun/scripts/smoke-test.sh

      - name: Smoke test packaged Linux app
        if: matrix.platform.os == 'linux'
        run: |
          bash packages/home/electrobun/scripts/smoke-test-linux.sh

      - name: Collect smoke diagnostics (Linux)
        if: always() && matrix.platform.os == 'linux'
        run: |
          diag_dir="packages/home/electrobun/artifacts/smoke-diagnostics/linux"
          mkdir -p "$diag_dir"
          find packages/home/electrobun/artifacts packages/home/electrobun/build -type f 2>/dev/null | sort > "$diag_dir/artifacts-list.txt" || true
          archive="$(
            find packages/home/electrobun/artifacts packages/home/electrobun/build \
              -type f \( -name '*.tar.gz' -o -name '*.tar.zst' \) 2>/dev/null \
              | sort \
              | head -1
          )"
          if [[ -n "$archive" ]]; then
            echo "archive=$archive" > "$diag_dir/archive.txt"
            if [[ "$archive" == *.tar.zst ]]; then
              tar --zstd -tf "$archive" > "$diag_dir/archive-members.txt" || true
            else
              tar -tzf "$archive" > "$diag_dir/archive-members.txt" || true
            fi
          fi

      - name: Collect smoke diagnostics (macOS)
        if: always() && matrix.platform.os == 'macos'
        run: |
          diag_dir="packages/home/electrobun/artifacts/smoke-diagnostics/macos"
          mkdir -p "$diag_dir"
          if [[ -d "${{ runner.temp }}/eliza-home-smoke-diagnostics" ]]; then
            cp -R "${{ runner.temp }}/eliza-home-smoke-diagnostics/." "$diag_dir/" || true
          fi
          if [[ -f "$HOME/.config/Eliza Home/eliza-home-startup.log" ]]; then
            cp "$HOME/.config/Eliza Home/eliza-home-startup.log" "$diag_dir/startup.log" || true
          fi

      - name: Collect smoke diagnostics (Windows)
        if: always() && matrix.platform.os == 'windows'
        shell: pwsh
        run: |
          $diagDir = Join-Path $PWD "packages/home/electrobun/artifacts/smoke-diagnostics/windows"
          New-Item -ItemType Directory -Force -Path $diagDir | Out-Null
          $startupLog = Join-Path $env:APPDATA "Eliza Home\eliza-home-startup.log"
          if (Test-Path $startupLog) {
            Copy-Item -Path $startupLog -Destination (Join-Path $diagDir "startup.log") -Force
          }
          $selfExtractionRoot = Join-Path $env:LOCALAPPDATA "ai.eliza.home\canary\self-extraction"
          if (Test-Path $selfExtractionRoot) {
            Get-ChildItem -Path $selfExtractionRoot -Recurse -File -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty FullName |
              Out-File -FilePath (Join-Path $diagDir "self-extraction-files.txt") -Encoding utf8
          }
          if ($env:MILADY_TEST_WINDOWS_SMOKE_LOG_FILE -and (Test-Path $env:MILADY_TEST_WINDOWS_SMOKE_LOG_FILE)) {
            Copy-Item -Path $env:MILADY_TEST_WINDOWS_SMOKE_LOG_FILE -Destination (Join-Path $diagDir "smoke-events.jsonl") -Force
          }
          $installerLog = Join-Path $env:MILADY_TEST_WINDOWS_SMOKE_TEMP_ROOT "installer.log"
          if (Test-Path $installerLog) {
            Copy-Item -Path $installerLog -Destination (Join-Path $diagDir "installer.log") -Force
          }
          $contractPath = Join-Path $PWD "packages/home/electrobun/artifacts/windows-installer-contract.json"
          if (Test-Path $contractPath) {
            Copy-Item -Path $contractPath -Destination (Join-Path $diagDir "windows-installer-contract.json") -Force
            $contract = Get-Content $contractPath | ConvertFrom-Json
            if (Test-Path $contract.installRoot) {
              Get-ChildItem -Path $contract.installRoot -Recurse -File -ErrorAction SilentlyContinue |
                Select-Object -ExpandProperty FullName |
                Out-File -FilePath (Join-Path $diagDir "installed-files.txt") -Encoding utf8
            }
            if (Test-Path $contract.expectedShortcutPath) {
              Copy-Item -Path $contract.expectedShortcutPath -Destination (Join-Path $diagDir "start-menu-shortcut.lnk") -Force
            }
            if (Test-Path $contract.installRoot) {
              $installedMetadataPath = Join-Path $contract.installRoot "install-metadata.json"
              if (Test-Path $installedMetadataPath) {
                Copy-Item -Path $installedMetadataPath -Destination (Join-Path $diagDir "install-metadata.json") -Force
              }
            }
          }
          $issPath = Join-Path $PWD "packages/home/electrobun/artifacts/windows-installer.iss"
          if (Test-Path $issPath) {
            Copy-Item -Path $issPath -Destination (Join-Path $diagDir "windows-installer.iss") -Force
          }
          $compilerLogPath = Join-Path $PWD "packages/home/electrobun/artifacts/windows-installer-build.log"
          if (Test-Path $compilerLogPath) {
            Copy-Item -Path $compilerLogPath -Destination (Join-Path $diagDir "windows-installer-build.log") -Force
          }
          Get-ChildItem -Path "packages/home/electrobun/build" -Recurse -File -Filter "wrapper-diagnostics.json" -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item -Path $_.FullName -Destination (Join-Path $diagDir "wrapper-diagnostics.json") -Force
          }

      - name: Stage Windows setup executables
        if: matrix.platform.os == 'windows'
        shell: pwsh
        run: |
          $artifactsDir = Join-Path $PWD "packages/home/electrobun/artifacts"
          $setupExecutables = Get-ChildItem -Path $artifactsDir -File -Filter "*Setup*.exe" -ErrorAction SilentlyContinue
          if (-not $setupExecutables) {
            Write-Error "No Windows wrapper installer found under packages/home/electrobun/artifacts"
            exit 1
          }
          $canonicalSetup = $setupExecutables |
            Where-Object { $_.Name -like "*win*x64*Setup*.exe" } |
            Sort-Object Length -Descending |
            Select-Object -First 1
          if (-not $canonicalSetup) {
            $canonicalSetup = $setupExecutables | Sort-Object Length -Descending | Select-Object -First 1
          }
          Write-Host "Staged canonical Windows setup executable: $($canonicalSetup.Name)"

      - name: Compress Windows artifacts before upload
        if: matrix.platform.os == 'windows'
        shell: pwsh
        run: |
          $artifactsDir = Join-Path $PWD "packages/home/electrobun/artifacts"
          Get-ChildItem -Path $artifactsDir -Filter "*win*x64*Setup*.exe" | ForEach-Object {
            $zipPath = $_.FullName + ".zip"
            Compress-Archive -Path $_.FullName -DestinationPath $zipPath -CompressionLevel Optimal
            Remove-Item $_.FullName -Force
          }
          Get-ChildItem -Path $artifactsDir -Filter "*.zip" |
            Where-Object { $_.Name -notlike "*win*x64*Setup*.exe.zip" } |
            Remove-Item -Force

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: home-electrobun-${{ matrix.platform.artifact-name }}
          path: |
            packages/home/electrobun/artifacts/*.dmg
            packages/home/electrobun/artifacts/*win*x64*Setup*.exe.zip
            packages/home/electrobun/artifacts/*.tar.zst
            packages/home/electrobun/artifacts/*.tar.gz
            packages/home/electrobun/artifacts/*-update.json
            packages/home/electrobun/artifacts/*.patch
            packages/home/electrobun/artifacts/*.AppImage
            packages/home/electrobun/artifacts/windows-installer-contract.json
            packages/home/electrobun/artifacts/windows-installer.iss
            packages/home/electrobun/artifacts/windows-installer-build.log
            packages/home/electrobun/artifacts/smoke-diagnostics/**
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  release:
    name: Create Release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: home-electrobun-*
          merge-multiple: false

      - name: List artifacts
        run: find release-artifacts -type f | sort 2>/dev/null || echo "No artifacts"

      - name: Collect public release files
        run: |
          mkdir -p release-files
          find release-artifacts -type f \( \
            -name "*.dmg" -o \
            -name "*win*x64*Setup*.exe.zip" -o \
            -name "*.tar.gz" -o \
            -name "*.AppImage" \
          \) -exec cp {} release-files/ \; 2>/dev/null || true

          echo "=== Public release files ==="
          ls -lh release-files/ 2>/dev/null || echo "None"

      - name: Validate Windows public installer bundle
        shell: bash
        run: |
          shopt -s nullglob
          windows_setup_zips=(release-files/*win*x64*Setup*.exe.zip)
          if [ ${#windows_setup_zips[@]} -ne 1 ]; then
            echo "::error::Expected exactly one canonical Windows setup zip in release-files, found ${#windows_setup_zips[@]}."
            ls -lh release-files || true
            exit 1
          fi
          for f in "${windows_setup_zips[@]}"; do
            if ! unzip -l "$f" | grep -Eiq 'setup.*\.exe'; then
              echo "::error::Windows setup zip missing setup .exe wrapper: $f"
              exit 1
            fi
          done

      - name: Generate checksums
        run: |
          cd release-files
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: Eliza Home ${{ needs.prepare.outputs.tag }}
          draft: ${{ inputs.draft || false }}
          prerelease: ${{ contains(needs.prepare.outputs.version, 'alpha') || contains(needs.prepare.outputs.version, 'beta') || contains(needs.prepare.outputs.version, 'rc') || contains(needs.prepare.outputs.tag, 'canary') }}
          generate_release_notes: true
          files: release-files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
