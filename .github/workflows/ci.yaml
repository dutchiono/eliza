name: ci

# Cancel previous runs for the same PR/branch
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, "dutchiono/eliza-home"]
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: write

jobs:
  # Test job
  test:
    # Run on PRs to main and on the main/home integration branches.
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'dutchiono/eliza-home'))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_REMOTE_ONLY: true
      PGLITE_WASM_MODE: node
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "23"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"

      - name: Install dependencies
        run: bun install

      - name: Generate shared proto types
        run: bun run generate:types

      - name: Create test env file
        if: github.event_name == 'pull_request' || github.ref_name == 'main'
        run: |
          echo "TEST_DATABASE_CLIENT=pglite" > packages/typescript/.env.test
          echo "NODE_ENV=test" >> packages/typescript/.env.test

      - name: Build packages
        if: github.event_name == 'pull_request' || github.ref_name == 'main'
        run: bun run build

      - name: Build autonomous runtime bundle
        if: github.event_name == 'push' && github.ref_name == 'dutchiono/eliza-home'
        run: |
          bun run build:core
          cd packages/autonomous && bun run build:dist

      - name: Run tests
        if: github.event_name == 'pull_request' || github.ref_name == 'main'
        timeout-minutes: 15
        env:
          NODE_OPTIONS: "--max-old-space-size=2048"
        run: bun run test:core

      - name: Run Home Electrobun tests
        if: github.event_name == 'push' && github.ref_name == 'dutchiono/eliza-home'
        run: cd packages/home/electrobun && bun run test

      - name: Run Home release readiness checks
        if: github.event_name == 'push' && github.ref_name == 'dutchiono/eliza-home'
        run: bun run release:check:home-electrobun

      - name: Run interop (TypeScript) tests
        if: github.event_name == 'pull_request' || github.ref_name == 'main'
        timeout-minutes: 10
        run: cd packages/interop && bun run test

      - name: Setup Python
        if: github.event_name == 'pull_request' || github.ref_name == 'main'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        if: github.event_name == 'pull_request' || github.ref_name == 'main'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r packages/python/requirements-dev.lock
          python -m pip install -e packages/python --no-deps

      - name: Run Python tests (@elizaos/python)
        if: github.event_name == 'pull_request' || github.ref_name == 'main'
        timeout-minutes: 10
        run: cd packages/python && python -m pytest -q

      - name: Run Python tests (@elizaos/interop python)
        if: github.event_name == 'pull_request' || github.ref_name == 'main'
        timeout-minutes: 10
        run: cd packages/interop/python && python -m pytest -q

      - name: Setup Rust
        if: github.event_name == 'pull_request' || github.ref_name == 'main'
        uses: dtolnay/rust-toolchain@stable

      - name: Run Rust tests (@elizaos/rust)
        if: github.event_name == 'pull_request' || github.ref_name == 'main'
        timeout-minutes: 10
        run: cd packages/rust && cargo test -q --locked

  # Lint and format job
  lint-and-format:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'dutchiono/eliza-home'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_REMOTE_ONLY: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "23"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"

      - name: Install dependencies
        run: bun install

      - name: Setup Python
        if: github.event_name == 'pull_request' || github.ref_name == 'main'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python lint tooling
        if: github.event_name == 'pull_request' || github.ref_name == 'main'
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff

      - name: Generate shared proto types
        run: bun run generate:types

      - name: Prompt secret scan
        run: cd packages/prompts && bun run check:secrets

      - name: Check Home branch format
        if: github.event_name == 'push' && github.ref_name == 'dutchiono/eliza-home'
        run: bun run format:check:home-electrobun

      - name: Check format
        if: github.event_name == 'pull_request' || github.ref_name == 'main'
        run: bun run format:check

      - name: Run Home branch lint
        if: github.event_name == 'push' && github.ref_name == 'dutchiono/eliza-home'
        run: bun run lint:home-electrobun

      - name: Run lint
        if: github.event_name == 'pull_request' || github.ref_name == 'main'
        run: bun run lint

  # Build job
  build:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'dutchiono/eliza-home'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_REMOTE_ONLY: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "23"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"

      - name: Install dependencies
        run: bun install

      - name: Generate shared proto types
        run: bun run generate:types

      - name: Build packages
        if: github.event_name == 'pull_request' || github.ref_name == 'main'
        run: bun run build

      - name: Stage Home desktop bundle
        if: github.event_name == 'push' && github.ref_name == 'dutchiono/eliza-home'
        run: node scripts/home-desktop-build.mjs stage --skip-install --skip-generate-types

  home-tests-passed:
    name: Tests / All Tests Passed
    runs-on: ubuntu-latest
    needs: [lint-and-format, test, build]
    if: github.event_name == 'push' && github.ref_name == 'dutchiono/eliza-home'
    steps:
      - name: Confirm CI gate
        run: echo "Core CI checks passed for dutchiono/eliza-home"

  home-prepare-release:
    name: Prepare Release
    runs-on: ubuntu-latest
    needs: [home-tests-passed]
    if: github.event_name == 'push' && github.ref_name == 'dutchiono/eliza-home'
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      env: ${{ steps.version.outputs.env }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Determine version + env
        id: version
        shell: bash
        run: |
          VERSION="$(node -p "require('./packages/home/package.json').version")"
          TAG="eliza-home-canary"
          BUILD_ENV="canary"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "env=$BUILD_ENV" >> "$GITHUB_OUTPUT"

  home-validate-release:
    name: Validate Release Inputs
    runs-on: ubuntu-latest
    needs: [home-tests-passed, home-prepare-release]
    if: github.event_name == 'push' && github.ref_name == 'dutchiono/eliza-home'
    env:
      BUN_VERSION: "1.3.9"
    defaults:
      run:
        shell: bash -euo pipefail {0}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-home-electrobun-validate-${{ hashFiles('bun.lock') }}
          restore-keys: bun-home-electrobun-validate-

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Generate shared proto types
        run: bun run generate:types

      - name: Align version with release tag
        run: node scripts/align-home-electrobun-version.mjs
        env:
          RELEASE_VERSION: ${{ needs.home-prepare-release.outputs.version }}

      - name: Release readiness checks
        run: bun run release:check:home-electrobun

  home-build-release:
    name: Build & Release / ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.runner }}
    needs: [home-tests-passed, home-prepare-release, home-validate-release]
    if: github.event_name == 'push' && github.ref_name == 'dutchiono/eliza-home'
    env:
      BUN_VERSION: "1.3.9"
    timeout-minutes: 150
    defaults:
      run:
        shell: bash -euo pipefail {0}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: macOS (Apple Silicon)
            os: macos
            runner: macos-14
            artifact-name: macos-arm64
          - name: macOS (Intel)
            os: macos
            runner: macos-15-intel
            artifact-name: macos-x64
          - name: Windows
            os: windows
            runner: windows-latest
            artifact-name: windows-x64
          - name: Linux
            os: linux
            runner: ubuntu-latest
            artifact-name: linux-x64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-home-electrobun-${{ matrix.platform.artifact-name }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-home-electrobun-${{ matrix.platform.artifact-name }}-

      - name: Install root dependencies
        run: |
          if [ "${{ matrix.platform.os }}" = "macos" ] && [ "${{ matrix.platform.artifact-name }}" = "macos-x64" ]; then
            arch -x86_64 bun install --frozen-lockfile
          else
            bun install --frozen-lockfile
          fi

      - name: Generate shared proto types
        run: bun run generate:types

      - name: Cache Whisper models and binaries
        if: matrix.platform.os == 'macos' || matrix.platform.os == 'linux'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/milady/whisper
            node_modules/whisper-node/lib/whisper.cpp/main
            node_modules/whisper-node/lib/whisper.cpp/build
          key: whisper-home-electrobun-${{ matrix.platform.artifact-name }}-${{ hashFiles('packages/home/electrobun/scripts/build-whisper.sh', 'packages/home/electrobun/scripts/build-whisper-universal.sh') }}
          restore-keys: whisper-home-electrobun-${{ matrix.platform.artifact-name }}-

      - name: Align version with release tag
        run: node scripts/align-home-electrobun-version.mjs
        env:
          RELEASE_VERSION: ${{ needs.home-prepare-release.outputs.version }}

      - name: Stage desktop bundle inputs
        run: |
          if [ "${{ matrix.platform.os }}" = "macos" ] && [ "${{ matrix.platform.artifact-name }}" = "macos-x64" ]; then
            ELIZA_HOME_SKIP_NATIVE_EFFECTS=1 ELIZA_HOME_DESKTOP_COMMAND_PREFIX="arch -x86_64" node scripts/home-desktop-build.mjs stage --skip-install --skip-generate-types
          elif [ "${{ matrix.platform.os }}" = "macos" ]; then
            ELIZA_HOME_SKIP_NATIVE_EFFECTS=1 node scripts/home-desktop-build.mjs stage --skip-install --skip-generate-types
          else
            node scripts/home-desktop-build.mjs stage --skip-install --skip-generate-types
          fi

      - name: Set up macOS signing keychain
        if: matrix.platform.os == 'macos'
        id: macos-keychain
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          if [ -z "$CSC_LINK" ]; then
            echo "::warning::CSC_LINK not set — building unsigned (no codesign/notarize)"
            echo "skip_codesign=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KEYCHAIN_PATH="$RUNNER_TEMP/eliza-home-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          echo "$CSC_LINK" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$CERT_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep "Developer ID Application" | head -1 | sed 's/.*"\(.*\)"/\1/')
          if [ -z "$IDENTITY" ]; then
            echo "::error::No 'Developer ID Application' identity found in certificate"
            exit 1
          fi
          echo "developer_id=$IDENTITY" >> "$GITHUB_OUTPUT"
          echo "skip_codesign=" >> "$GITHUB_OUTPUT"

      - name: Ensure Windows rcedit binary is available for Electrobun
        if: matrix.platform.os == 'windows'
        shell: pwsh
        run: |
          $electrobunDir = Join-Path $PWD "packages/home/electrobun/node_modules/electrobun"
          $resolvedElectrobunDir = node -e @'
            const fs = require("node:fs");
            const packageDir = process.argv[1];
            try { process.stdout.write(fs.realpathSync(packageDir)); } catch (error) { process.stdout.write(packageDir); }
          '@ $electrobunDir
          $resolvedElectrobunDir = "$resolvedElectrobunDir".Trim()
          if ([string]::IsNullOrWhiteSpace($resolvedElectrobunDir)) { $resolvedElectrobunDir = $electrobunDir }
          $globalNodeModules = Join-Path $env:USERPROFILE ".bun\install\global\node_modules"
          $globalRceditDir = Join-Path $globalNodeModules "rcedit"
          $globalRceditExe = Join-Path $globalRceditDir "bin\rcedit-x64.exe"
          if (-not (Test-Path $globalRceditExe)) { bun install -g "rcedit@4.0.1" }
          $resolvedRceditDir = Join-Path $resolvedElectrobunDir "node_modules\rcedit"
          $resolvedRceditExe = Join-Path $resolvedRceditDir "bin\rcedit-x64.exe"
          if (-not (Test-Path $resolvedRceditExe)) {
            $resolvedNodeModulesDir = Split-Path -Parent $resolvedRceditDir
            New-Item -ItemType Directory -Force -Path $resolvedNodeModulesDir | Out-Null
            if (Test-Path $resolvedRceditDir) { Remove-Item -Recurse -Force $resolvedRceditDir }
            Copy-Item -Recurse -Force $globalRceditDir $resolvedNodeModulesDir
          }
          if (-not (Test-Path $resolvedRceditExe)) { Write-Error "rcedit-x64.exe is still missing at $resolvedRceditExe"; exit 1 }

      - name: Pre-extract electrobun native CLI on Windows
        if: matrix.platform.os == 'windows'
        shell: pwsh
        run: |
          $electrobunDir = Join-Path $PWD "packages/home/electrobun/node_modules/electrobun"
          $resolvedElectrobunDir = node -e @'
            const fs = require("node:fs");
            const packageDir = process.argv[1];
            try { process.stdout.write(fs.realpathSync(packageDir)); } catch (error) { process.stdout.write(packageDir); }
          '@ $electrobunDir
          $resolvedElectrobunDir = "$resolvedElectrobunDir".Trim()
          if ([string]::IsNullOrWhiteSpace($resolvedElectrobunDir)) { $resolvedElectrobunDir = $electrobunDir }
          $cacheDir = Join-Path $resolvedElectrobunDir ".cache"
          $binDir = Join-Path $resolvedElectrobunDir "bin"
          $cliBinary = Join-Path $cacheDir "electrobun.exe"
          $binBinary = Join-Path $binDir "electrobun.exe"
          if (Test-Path $binBinary) { exit 0 }
          $version = (Get-Content (Join-Path $resolvedElectrobunDir "package.json") | ConvertFrom-Json).version
          $releaseApiUrl = "https://api.github.com/repos/blackboardsh/electrobun/releases/tags/v$version"
          $headers = @{ Accept = "application/vnd.github+json"; "User-Agent" = "eliza-home-ci" }
          if ($env:GITHUB_TOKEN) { $headers.Authorization = "Bearer $env:GITHUB_TOKEN" }
          $release = Invoke-RestMethod -Uri $releaseApiUrl -Headers $headers
          $asset = @($release.assets) | Where-Object { $_.name -eq "electrobun-cli-win-x64.tar.gz" } | Select-Object -First 1
          if (-not $asset) { Write-Error "Could not find electrobun-cli-win-x64.tar.gz"; exit 1 }
          New-Item -ItemType Directory -Force -Path $cacheDir | Out-Null
          $tarPath = Join-Path $cacheDir "electrobun-win-x64.tar.gz"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $tarPath -UseBasicParsing
          & "C:\Windows\System32\tar.exe" -xzf $tarPath -C $cacheDir
          Remove-Item $tarPath -Force
          New-Item -ItemType Directory -Force -Path $binDir | Out-Null
          Copy-Item $cliBinary $binBinary
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package Home Electrobun
        run: |
          if [ "${{ matrix.platform.os }}" = "macos" ] && [ "${{ matrix.platform.artifact-name }}" = "macos-x64" ]; then
            ELIZA_HOME_DESKTOP_COMMAND_PREFIX="arch -x86_64" node scripts/home-desktop-build.mjs package --env=${{ needs.home-prepare-release.outputs.env }}
          else
            node scripts/home-desktop-build.mjs package --env=${{ needs.home-prepare-release.outputs.env }}
          fi
        env:
          ELECTROBUN_DEVELOPER_ID: ${{ steps.macos-keychain.outputs.developer_id }}
          ELECTROBUN_APPLEID: ${{ secrets.APPLE_ID }}
          ELECTROBUN_APPLEIDPASS: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          ELECTROBUN_TEAMID: ${{ secrets.APPLE_TEAM_ID }}
          ELECTROBUN_SKIP_CODESIGN: ${{ steps.macos-keychain.outputs.skip_codesign }}
          ELIZA_HOME_ELECTROBUN_NOTARIZE: 0

      - name: Inject version.json into bundle (Windows)
        if: matrix.platform.os == 'windows'
        shell: pwsh
        run: |
          $version = (Get-Content packages/home/electrobun/package.json | ConvertFrom-Json).version
          $envName = "${{ needs.home-prepare-release.outputs.env }}"
          Get-ChildItem -Path "packages/home/electrobun/build" -Recurse -Directory -Filter "Resources" | ForEach-Object {
            $versionJson = @{ identifier = "ai.eliza.home"; channel = $envName; name = "eliza-home"; version = $version } | ConvertTo-Json -Compress
            Set-Content -Path (Join-Path $_.FullName "version.json") -Value $versionJson -Encoding utf8
          }

      - name: Inject version.json into bundle (macOS / Linux)
        if: matrix.platform.os != 'windows'
        run: |
          VERSION="$(node -p "require('./packages/home/electrobun/package.json').version")"
          ENV_NAME="${{ needs.home-prepare-release.outputs.env }}"
          find packages/home/electrobun/build -type d -name "Resources" | while read -r res_dir; do
            printf '{"identifier":"ai.eliza.home","channel":"%s","name":"eliza-home","version":"%s"}' "$ENV_NAME" "$VERSION" > "$res_dir/version.json"
          done

      - name: Smoke test packaged Windows app
        if: matrix.platform.os == 'windows'
        shell: pwsh
        env:
          MILADY_DISABLE_LOCAL_EMBEDDINGS: "1"
          MILADY_TEST_WINDOWS_LAUNCHER_DIR: ${{ runner.temp }}\eliza-home-windows-ui-launcher
          MILADY_TEST_WINDOWS_LAUNCHER_PATH_FILE: ${{ runner.temp }}\eliza-home-windows-ui-launcher.txt
        run: |
          pwsh -File packages/home/electrobun/scripts/smoke-test-windows.ps1 `
            -PreferInstaller `
            -ExpectedInstallDir (Join-Path $env:LOCALAPPDATA "Programs\Eliza Home")

      - name: Smoke test packaged macOS app
        if: matrix.platform.os == 'macos'
        env:
          SMOKE_DIAGNOSTICS_DIR: ${{ runner.temp }}/eliza-home-smoke-diagnostics
        run: |
          STARTUP_TIMEOUT=420 \
          LIVENESS_TIMEOUT=10 \
          SKIP_BUILD=1 \
          SKIP_SIGNATURE_CHECK=1 \
          bash packages/home/electrobun/scripts/smoke-test.sh

      - name: Smoke test packaged Linux app
        if: matrix.platform.os == 'linux'
        run: |
          bash packages/home/electrobun/scripts/smoke-test-linux.sh

      - name: Collect smoke diagnostics (Linux)
        if: always() && matrix.platform.os == 'linux'
        run: |
          diag_dir="packages/home/electrobun/artifacts/smoke-diagnostics/linux"
          mkdir -p "$diag_dir"
          find packages/home/electrobun/artifacts packages/home/electrobun/build -type f 2>/dev/null | sort > "$diag_dir/artifacts-list.txt" || true
          archive="$(
            find packages/home/electrobun/artifacts packages/home/electrobun/build \
              -type f \( -name '*.tar.gz' -o -name '*.tar.zst' \) 2>/dev/null \
              | sort \
              | head -1
          )"
          if [[ -n "$archive" ]]; then
            echo "archive=$archive" > "$diag_dir/archive.txt"
            if [[ "$archive" == *.tar.zst ]]; then
              tar --zstd -tf "$archive" > "$diag_dir/archive-members.txt" || true
            else
              tar -tzf "$archive" > "$diag_dir/archive-members.txt" || true
            fi
          fi

      - name: Collect smoke diagnostics (macOS)
        if: always() && matrix.platform.os == 'macos'
        run: |
          diag_dir="packages/home/electrobun/artifacts/smoke-diagnostics/macos"
          mkdir -p "$diag_dir"
          if [[ -d "${{ runner.temp }}/eliza-home-smoke-diagnostics" ]]; then
            cp -R "${{ runner.temp }}/eliza-home-smoke-diagnostics/." "$diag_dir/" || true
          fi
          if [[ -f "$HOME/.config/Eliza Home/eliza-home-startup.log" ]]; then
            cp "$HOME/.config/Eliza Home/eliza-home-startup.log" "$diag_dir/startup.log" || true
          fi

      - name: Collect smoke diagnostics (Windows)
        if: always() && matrix.platform.os == 'windows'
        shell: pwsh
        run: |
          $diagDir = Join-Path $PWD "packages/home/electrobun/artifacts/smoke-diagnostics/windows"
          New-Item -ItemType Directory -Force -Path $diagDir | Out-Null
          $startupLog = Join-Path $env:APPDATA "Eliza Home\eliza-home-startup.log"
          if (Test-Path $startupLog) {
            Copy-Item -Path $startupLog -Destination (Join-Path $diagDir "startup.log") -Force
          }
          $selfExtractionRoot = Join-Path $env:LOCALAPPDATA "ai.eliza.home\canary\self-extraction"
          if (Test-Path $selfExtractionRoot) {
            Get-ChildItem -Path $selfExtractionRoot -Recurse -File -ErrorAction SilentlyContinue |
              Select-Object FullName,Length,LastWriteTime |
              Out-File -FilePath (Join-Path $diagDir "self-extraction-files.txt") -Encoding utf8
          }

      - name: Stage Windows setup executables
        if: matrix.platform.os == 'windows'
        shell: pwsh
        run: |
          $artifactsDir = Join-Path $PWD "packages/home/electrobun/artifacts"
          $setupExecutables = Get-ChildItem -Path "packages/home/electrobun/build" -Recurse -File -Filter "*Setup*.exe" -ErrorAction SilentlyContinue
          if (-not $setupExecutables) { Write-Error "No Windows setup executable found under packages/home/electrobun/build"; exit 1 }
          $canonicalSetup = $setupExecutables |
            Where-Object { $_.Name -like "*win*x64*Setup*.exe" } |
            Sort-Object Length -Descending |
            Select-Object -First 1
          if (-not $canonicalSetup) {
            $canonicalSetup = $setupExecutables | Sort-Object Length -Descending | Select-Object -First 1
          }
          New-Item -ItemType Directory -Force -Path $artifactsDir | Out-Null
          Copy-Item $canonicalSetup.FullName -Destination $artifactsDir -Force

      - name: Compress Windows artifacts before upload
        if: matrix.platform.os == 'windows'
        shell: pwsh
        run: |
          $artifactsDir = Join-Path $PWD "packages/home/electrobun/artifacts"
          Get-ChildItem -Path $artifactsDir -Filter "*win*x64*Setup*.exe" | ForEach-Object {
            $zipPath = $_.FullName + ".zip"
            Compress-Archive -Path $_.FullName -DestinationPath $zipPath -CompressionLevel Optimal
            Remove-Item $_.FullName -Force
          }
          Get-ChildItem -Path $artifactsDir -Filter "*.zip" |
            Where-Object { $_.Name -notlike "*win*x64*Setup*.zip" } |
            Remove-Item -Force

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: home-electrobun-${{ matrix.platform.artifact-name }}
          path: |
            packages/home/electrobun/artifacts/*.dmg
            packages/home/electrobun/artifacts/*win*x64*Setup*.zip
            packages/home/electrobun/artifacts/*.tar.zst
            packages/home/electrobun/artifacts/*.tar.gz
            packages/home/electrobun/artifacts/*-update.json
            packages/home/electrobun/artifacts/*.patch
            packages/home/electrobun/artifacts/*.AppImage
            packages/home/electrobun/artifacts/smoke-diagnostics/**
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  home-create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [home-prepare-release, home-build-release]
    if: github.event_name == 'push' && github.ref_name == 'dutchiono/eliza-home'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: home-electrobun-*
          merge-multiple: false

      - name: Collect public release files
        run: |
          mkdir -p release-files
          find release-artifacts -type f \( -name "*.dmg" -o -name "*win*x64*Setup*.zip" -o -name "*.tar.gz" -o -name "*.AppImage" \) -exec cp {} release-files/ \; 2>/dev/null || true
          ls -lh release-files/ 2>/dev/null || echo "None"

      - name: Validate Windows public installer bundle
        shell: bash
        run: |
          shopt -s nullglob
          windows_setup_zips=(release-files/*win*x64*Setup*.zip)
          if [ ${#windows_setup_zips[@]} -ne 1 ]; then
            echo "::error::Expected exactly one canonical Windows setup zip in release-files, found ${#windows_setup_zips[@]}."
            ls -lh release-files || true
            exit 1
          fi
          for f in "${windows_setup_zips[@]}"; do
            unzip -l "$f" | grep -Eiq 'setup.*\.exe'
          done

      - name: Generate checksums
        run: |
          cd release-files
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.home-prepare-release.outputs.tag }}
          name: Eliza Home ${{ needs.home-prepare-release.outputs.tag }}
          draft: true
          prerelease: true
          generate_release_notes: true
          files: release-files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
